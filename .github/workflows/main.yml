---
"on":
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  files: dist/*

jobs:
  build-wheels-and-test:
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{matrix.runs-on}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - uses: docker/setup-qemu-action@v3
        if: runner.os == 'Linux'
      - uses: pypa/cibuildwheel@v3.1
        with:
          package-dir: crates/py-tree-sitter-highlight
      - uses: actions/upload-artifact@v5
        with:
          name: artifact-${{matrix.runs-on}}
          path: |
            wheelhouse/*.whl

  build-napi-prebuilds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            dest: linux-x64
          - runs-on: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            dest: linux-arm64
          - runs-on: macos-latest
            target: x86_64-apple-darwin
            dest: darwin-x64
          - runs-on: macos-latest
            target: aarch64-apple-darwin
            dest: darwin-arm64
          - runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            dest: win32-x64
    runs-on: ${{matrix.runs-on}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - name: Build prebuild
        run: |
          rustup target add ${{matrix.target}}
          npm run prebuildify -w tree-sitter-highlight
      - uses: actions/upload-artifact@v5
        with:
          name: npm-prebuild-${{matrix.dest}}
          path: prebuilds

  build:
    needs:
      - build-wheels-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: Build sdist
        run: |
          uv build --package=tree-sitter-highlight --sdist
      - uses: actions/upload-artifact@v5
        if: "! startsWith(github.ref, 'refs/tags/')"
        with:
          name: artifact-sdist
          path: |
            ${{env.files}}
      - uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{env.files}}
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/')

  publish-npm:
    needs:
      - build-napi-prebuilds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-prebuild-*
          merge-multiple: true
          path: prebuilds
      - uses: actions/upload-artifact@v5
        if: "! startsWith(github.ref, 'refs/tags/')"
        with:
          name: artifact-prebuild
          path: |
            prebuilds
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            prebuilds
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish -w tree-sitter-highlight
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
