[project]
name = "tree-sitter-highlight"
version = "0.0.1"
description = "python binding for tree-sitter-highlight"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
authors = [{ name = "Wu, Zhenyu", email = "wuzhenyu@ustc.edu" }]
dependencies = []

[project.urls]
homepage = "https://github.com/sphinx-contrib/tree-sitter-highlight"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.cibuildwheel]
archs = ["all"]
skip = "*37-* *38-* *39-*"
build-frontend = "build[uv]"
before-test = "pip install .[dev]"
test-command = "pytest {project}"

# https://github.com/astral-sh/uv/issues/10260
[[tool.cibuildwheel.overrides]]
select = ["*-musllinux_s390x", "*-musllinux_ppc64*", "*-musllinux_riscv64"]
build-frontend = "build"

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "\\s*import tomli as tomllib",
]

[tool.maturin]
features = ["pyo3/abi3-py38", "pyo3/extension-module"]
manifest-path = "crates/py-tree-sitter-highlight/Cargo.toml"
module-name = "tree_sitter_highlight"

[tool.mdformat]
number = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = ["D205", "D400"]
preview = true

[tool.ruff.format]
docstring-code-format = true
preview = true

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "crates/**/*.rs" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" }
]

[tool.uv.workspace]
members = [
  "packages/sphinxcontrib-tree-sitter",
]
