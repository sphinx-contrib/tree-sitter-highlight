[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "\\s*import tomli as tomllib",
]

[tool.doq]
template_path = "templates"

[tool.mdformat]
number = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = ["D205", "D400"]
preview = true

[tool.ruff.format]
docstring-code-format = true
preview = true

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "crates/**/*.rs" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" }
]

[tool.uv.workspace]
members = [
  "crates/py-tree-sitter-highlight",
  "packages/*",
]
